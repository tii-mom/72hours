    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        try {
          var storageKey = "72hours.theme";
          var theme = window.localStorage.getItem(storageKey) === "clarity" ? "clarity" : "signal";
          var root = document.documentElement;
          root.dataset.theme = theme;
          root.style.colorScheme = theme === "clarity" ? "light" : "dark";

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", theme === "clarity" ? "#f6f7f1" : "#030604");
          }
        } catch (error) {
          // Ignore bootstrap failures and fall back to the stylesheet default.
        }
      })();
    </script>
